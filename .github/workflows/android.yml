name: android

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-apk:
    name: build apk (Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Android workload
        run: dotnet workload install android --skip-sign-check

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-android-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/Melotag.Android/Melotag.Android.csproj

      - name: Publish APK (Release)
        run: >
          dotnet publish src/Melotag.Android/Melotag.Android.csproj
          -c Release --no-restore
          -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: melotag-android-apk
          path: src/Melotag.Android/bin/Release/**/*.apk
          if-no-files-found: error
          retention-days: 14

  test:
    name: unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Melotag.Core.Tests/Melotag.Core.Tests.csproj

      - name: Test
        run: dotnet test tests/Melotag.Core.Tests/Melotag.Core.Tests.csproj -c Release --logger "console;verbosity=minimal"
