name: android

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-apk:
    name: build apk (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 真机用 arm64，模拟器用 x64；两个 ABI 并行各出一个包
        rid: [ android-arm64, android-x64 ]
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Android workload
        run: dotnet workload install android --skip-sign-check

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-android-${{ matrix.rid }}-

      - name: Restore
        run: dotnet restore src/Melotag.Android/Melotag.Android.csproj

      - name: Decode signing keystore
        shell: bash
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，使用调试签名（仅适合侧载测试）。"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/melotag.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/melotag.keystore" >> "$GITHUB_ENV"

      - name: Publish APK (Release)
        shell: bash
        run: |
          args=()
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            args+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$ANDROID_KEYSTORE_PATH"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
            )
            echo "使用仓库 Secrets 中的固定签名。"
          else
            echo "未找到签名密钥，使用调试签名。"
          fi

          dotnet publish src/Melotag.Android/Melotag.Android.csproj \
            -c Release --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:RuntimeIdentifier=${{ matrix.rid }} \
            "${args[@]}"

      - name: List APK
        run: find src/Melotag.Android/bin/Release -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: melotag-${{ matrix.rid }}-apk
          path: src/Melotag.Android/bin/Release/**/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 14

  test:
    name: unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Melotag.Core.Tests/Melotag.Core.Tests.csproj

      - name: Test
        run: dotnet test tests/Melotag.Core.Tests/Melotag.Core.Tests.csproj -c Release --logger "console;verbosity=minimal"
