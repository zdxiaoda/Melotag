name: release

# 触发条件：
#   1) 推送 v* 标签（如 v1.0.0）→ 测试 + 打包 + 自动创建 GitHub Release
#   2) 手动运行 → 只打包并上传 workflow artifact，不发布
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（例如 v1.0.1）；手动运行只打包，不发布'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish (${{ matrix.rid }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: bash
        run: |
          ref="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Melotag.Desktop \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$APP_VERSION" \
            -o "dist/${{ matrix.rid }}"
          find "dist/${{ matrix.rid }}" -name '*.pdb' -delete

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}
          if-no-files-found: error

  release:
    name: release
    needs: publish
    # 只有推送版本标签时才自动发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out stage

          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zip
          fi

          readme() {
            cat <<EOF
          音签 Melotag ${version}
          跨平台音乐标签编辑器（Windows / Linux）

          运行：$1

          数据目录：$2，可用环境变量 MELOTAG_DATA_DIR 覆盖。
          项目主页：https://github.com/${GITHUB_REPOSITORY}
          EOF
          }

          win="Melotag-${version}-win-x64"
          mkdir -p "stage/$win"
          cp -r artifacts/publish-win-x64/. "stage/$win/"
          readme "双击 Melotag.exe（自包含，无需安装 .NET）" "%APPDATA%\\Melotag" > "stage/$win/README.txt"
          (cd stage && zip -qr "../out/$win.zip" "$win")

          lin="Melotag-${version}-linux-x64"
          mkdir -p "stage/$lin"
          cp -r artifacts/publish-linux-x64/. "stage/$lin/"
          chmod +x "stage/$lin/Melotag"
          cp docs/branding/melotag-logo.png "stage/$lin/melotag.png"
          cp packaging/linux/melotag.desktop "stage/$lin/"
          readme "./Melotag 或执行 install.sh 安装桌面项" "~/.config/Melotag" > "stage/$lin/README.txt"

          cat > "stage/$lin/install.sh" <<'EOF'
          #!/usr/bin/env bash
          # 安装到 ~/.local：二进制、图标与桌面项
          set -euo pipefail
          here="$(cd "$(dirname "$0")" && pwd)"
          bin="$HOME/.local/bin"
          share="$HOME/.local/share"
          mkdir -p "$bin" "$share/applications" "$share/icons/hicolor/512x512/apps"
          install -Dm755 "$here/Melotag" "$bin/Melotag"
          install -Dm644 "$here/melotag.png" "$share/icons/hicolor/512x512/apps/melotag.png"
          install -Dm644 "$here/melotag.desktop" "$share/applications/melotag.desktop"
          echo "已安装到 $bin/Melotag，桌面项已写入 $share/applications"
          EOF
          chmod +x "stage/$lin/install.sh"

          tar -czf "out/$lin.tar.gz" -C stage "$lin"

          (cd out && sha256sum ./*.zip ./*.tar.gz > SHA256SUMS.txt)
          ls -lh out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "音签 Melotag ${GITHUB_REF_NAME#v}" \
            --generate-notes
