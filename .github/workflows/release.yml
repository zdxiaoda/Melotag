name: release

# 触发条件：
#   1) 推送 v* 标签（如 v1.0.0）→ 测试 + 打包 + 自动创建 GitHub Release
#   2) 手动运行 → 默认只打包并上传 workflow artifact；勾选 publish 时同时发布/更新 Release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（例如 v1.0.1）'
        required: true
        type: string
      publish:
        description: '同时创建/更新 GitHub Release（附件会被覆盖上传）'
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    name: publish (${{ matrix.rid }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: bash
        run: |
          ref="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        run: |
          # 框架依赖（不打包 .NET 运行时）：体积从 ~110MB 降到 ~35MB，
          # 缺少运行时由 apphost 在启动时提示并给出下载地址。
          dotnet publish src/Melotag.Desktop \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$APP_VERSION" \
            -o "dist/${{ matrix.rid }}"
          find "dist/${{ matrix.rid }}" -name '*.pdb' -delete

      - name: Publish self-contained (Windows installer)
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          # 安装包自带 .NET 运行时，用户无需另外安装。
          dotnet publish src/Melotag.Desktop \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$APP_VERSION" \
            -o "dist/${{ matrix.rid }}-payload"
          find "dist/${{ matrix.rid }}-payload" -name '*.pdb' -delete

      - name: Build Windows installer
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            # arm64 架构标识需要 Inno Setup 6.3+，Chocolatey 安装的是最新 6.x。
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $rid = "${{ matrix.rid }}"
          $arch = if ($rid -eq 'win-arm64') { 'arm64' } else { 'x64' }
          New-Item -ItemType Directory -Force -Path "dist/$rid-installer" | Out-Null
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/DMyAppRid=$rid" "/DMyAppArch=$arch" "packaging/windows/melotag.iss"
          Get-ChildItem "dist/$rid-installer" | Format-Table Name,Length

      - name: Upload Windows installer
        if: startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}-installer/*.exe
          if-no-files-found: error

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}
          if-no-files-found: error

  msix:
    name: msix
    needs: ci
    runs-on: windows-latest
    env:
      # 兼容 Variables / Secrets；PUBLISHERDISPLAYNAME 是当前仓库已设置的 Secret 名。
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || secrets.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || secrets.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || secrets.MSIX_PUBLISHER_DISPLAY_NAME || secrets.PUBLISHERDISPLAYNAME }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: bash
        run: |
          ref="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish self-contained (MSIX x64)
        if: env.MSIX_IDENTITY_NAME != '' && env.MSIX_PUBLISHER != '' && env.MSIX_PUBLISHER_DISPLAY_NAME != ''
        shell: bash
        run: |
          dotnet publish src/Melotag.Desktop \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=false \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:Version="$APP_VERSION" \
            -o dist/win-x64-msix
          find dist/win-x64-msix -name '*.pdb' -delete

      - name: Publish self-contained (MSIX arm64)
        if: env.MSIX_IDENTITY_NAME != '' && env.MSIX_PUBLISHER != '' && env.MSIX_PUBLISHER_DISPLAY_NAME != ''
        shell: bash
        run: |
          dotnet publish src/Melotag.Desktop \
            -c Release -r win-arm64 --self-contained true \
            -p:PublishSingleFile=false \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:Version="$APP_VERSION" \
            -o dist/win-arm64-msix
          find dist/win-arm64-msix -name '*.pdb' -delete

      - name: Build MSIX packages
        if: env.MSIX_IDENTITY_NAME != '' && env.MSIX_PUBLISHER != '' && env.MSIX_PUBLISHER_DISPLAY_NAME != ''
        shell: pwsh
        run: |
          $parts = $env:APP_VERSION -split '\.'
          $msixVersion = (($parts + @('0','0','0'))[0..3]) -join '.'
          foreach ($arch in @('x64', 'arm64')) {
            ./packaging/windows/msix/build-msix.ps1 `
              -Version $msixVersion `
              -Architecture $arch `
              -IdentityName "$env:MSIX_IDENTITY_NAME" `
              -Publisher "$env:MSIX_PUBLISHER" `
              -PublisherDisplayName "$env:MSIX_PUBLISHER_DISPLAY_NAME" `
              -SourceDir "dist/win-$arch-msix" `
              -Output "dist/msix/win-$arch/Melotag-$env:APP_VERSION-win-$arch.msix"
          }

      - name: Build MSIX bundle
        if: env.MSIX_IDENTITY_NAME != '' && env.MSIX_PUBLISHER != '' && env.MSIX_PUBLISHER_DISPLAY_NAME != ''
        shell: pwsh
        run: |
          ./packaging/windows/msix/build-msix-bundle.ps1 `
            -Version $env:APP_VERSION `
            -PackageDir "dist/msix/win-x64", "dist/msix/win-arm64" `
            -Output "dist/msix-bundle/Melotag-$env:APP_VERSION.msixbundle"

      - name: Upload MSIX bundle
        if: env.MSIX_IDENTITY_NAME != '' && env.MSIX_PUBLISHER != '' && env.MSIX_PUBLISHER_DISPLAY_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: msix-bundle
          path: dist/msix-bundle/*.msixbundle
          if-no-files-found: error

  release:
    name: release
    needs: [ publish, android, msix ]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Resolve version
        shell: bash
        run: |
          echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="$APP_VERSION"
          mkdir -p out stage dist

          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zip
          fi

          # Windows 安装包由 publish 任务在 Windows 上生成，商店包由 msix 任务合成 bundle
          if compgen -G "artifacts/installer-win-*/*.exe" >/dev/null; then
            cp artifacts/installer-win-*/*.exe out/
          fi
          if compgen -G "artifacts/msix-bundle/*.msixbundle" >/dev/null; then
            cp artifacts/msix-bundle/*.msixbundle out/
          fi

          readme() {
            cat <<EOF
          音签 Melotag ${version}
          跨平台音乐标签编辑器（Windows / Linux）

          需要 .NET 10 运行时（本包不包含）。未安装时启动会提示并给出下载地址：
            https://dotnet.microsoft.com/download/dotnet/10.0

          运行：$1

          数据目录：$2，可用环境变量 MELOTAG_DATA_DIR 覆盖。
          项目主页：https://github.com/${GITHUB_REPOSITORY}
          EOF
          }

          for arch in x64 arm64; do
            win="Melotag-${version}-win-${arch}"
            mkdir -p "stage/$win"
            cp -r "artifacts/publish-win-${arch}/." "stage/$win/"
            cp LICENSE "stage/$win/LICENSE.txt"
            readme "双击 Melotag.exe" "%APPDATA%\\Melotag" > "stage/$win/README.txt"
            (cd stage && zip -qr "../out/$win.zip" "$win")
          done

          lin="Melotag-${version}-linux-x64"
          mkdir -p "stage/$lin"
          cp -r artifacts/publish-linux-x64/. "stage/$lin/"
          chmod +x "stage/$lin/Melotag"
          cp docs/branding/melotag-logo.png "stage/$lin/melotag.png"
          cp packaging/linux/melotag.desktop "stage/$lin/"
          cp LICENSE "stage/$lin/LICENSE"
          readme "./Melotag 或执行 install.sh 安装桌面项" "~/.config/Melotag" > "stage/$lin/README.txt"

          cat > "stage/$lin/install.sh" <<'EOF'
          #!/usr/bin/env bash
          # 安装到 ~/.local：二进制、图标与桌面项
          set -euo pipefail
          here="$(cd "$(dirname "$0")" && pwd)"
          bin="$HOME/.local/bin"
          share="$HOME/.local/share"
          mkdir -p "$bin" "$share/applications" "$share/icons/hicolor/512x512/apps"
          install -Dm755 "$here/Melotag" "$bin/Melotag"
          install -Dm644 "$here/melotag.png" "$share/icons/hicolor/512x512/apps/melotag.png"
          install -Dm644 "$here/melotag.desktop" "$share/applications/melotag.desktop"
          echo "已安装到 $bin/Melotag，桌面项已写入 $share/applications"
          EOF
          chmod +x "stage/$lin/install.sh"

          tar -czf "out/$lin.tar.gz" -C stage "$lin"

          ls -lh out

      - name: Build .deb
        shell: bash
        run: |
          set -euo pipefail
          pkg=melotag
          root="stage/deb"
          rm -rf "$root"
          mkdir -p out "$root/DEBIAN" \
                   "$root/usr/bin" \
                   "$root/usr/share/applications" \
                   "$root/usr/share/icons/hicolor/512x512/apps" \
                   "$root/usr/share/doc/$pkg"

          install -m755 artifacts/publish-linux-x64/Melotag "$root/usr/bin/melotag"
          install -m644 docs/branding/melotag-logo.png "$root/usr/share/icons/hicolor/512x512/apps/melotag.png"
          sed -e 's/^Exec=Melotag/Exec=melotag/' \
              -e 's/^StartupWMClass=Melotag/StartupWMClass=melotag/' \
              packaging/linux/melotag.desktop \
            > "$root/usr/share/applications/$pkg.desktop"
          chmod 644 "$root/usr/share/applications/$pkg.desktop"

          cat > "$root/usr/share/doc/$pkg/copyright" <<EOF
          Melotag ${APP_VERSION}
          跨平台音乐标签编辑器。

          上游项目：https://github.com/${GITHUB_REPOSITORY}
          许可证：MIT；本包同时包含下列第三方组件：
           Avalonia (MIT)、FluentAvalonia (MIT)、TagLib# (LGPL-2.1)、
           SkiaSharp (MIT)、OpenCC (Apache-2.0)、Microsoft.Data.Sqlite (MIT)。
          EOF
          chmod 644 "$root/usr/share/doc/$pkg/copyright"
          install -m644 LICENSE "$root/usr/share/doc/$pkg/LICENSE"

          {
            echo "$pkg (${APP_VERSION}) unstable; urgency=medium"
            echo
            echo "  * Release ${APP_VERSION}."
            echo
            echo " -- zdxiaoda <xiaoda@duck.com>  $(date -R)"
          } | gzip -9n > "$root/usr/share/doc/$pkg/changelog.Debian.gz"

          size=$(du -sk "$root" | cut -f1)
          (cd "$root" && find usr -type f -print0 | sort -z | xargs -0 md5sum -t) > "$root/DEBIAN/md5sums"
          chmod 644 "$root/DEBIAN/md5sums"
          cat > "$root/DEBIAN/control" <<EOF
          Package: $pkg
          Version: ${APP_VERSION}
          Architecture: amd64
          Maintainer: zdxiaoda <xiaoda@duck.com>
          Installed-Size: ${size}
          Section: sound
          Priority: optional
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Depends: libc6, libfontconfig1, libfreetype6, libice6, libsm6, libx11-6, libxcb1, libxkbcommon0, libxrandr2, libxi6, libxcursor1, libxinerama1, libegl1, libgl1, libglib2.0-0 | libglib2.0-0t64
          Recommends: dotnet-runtime-10.0
          Description: 音签 Melotag - 跨平台音乐标签编辑器
           支持 MP3 / FLAC / APE / OGG / MP4 等容器的标签、封面与歌词读写，
           可从多个在线源匹配元数据，并带有重命名、历史撤销与简繁转换。
           .
           需要 .NET 10 运行时（本包不包含）；未安装时启动会提示并给出下载地址。
          EOF

          dpkg-deb --root-owner-group -Zxz --build "$root" "out/${pkg}_${APP_VERSION}_amd64.deb"
          dpkg-deb --info "out/${pkg}_${APP_VERSION}_amd64.deb"
          dpkg-deb --contents "out/${pkg}_${APP_VERSION}_amd64.deb" | head -20
          ls -lh out

      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

          root="$(pwd)"
          mkdir -p dist/rpmbuild/BUILD dist/rpmbuild/RPMS dist/rpmbuild/SOURCES \
                   dist/rpmbuild/SPECS dist/rpmbuild/SRPMS
          sed -e "s|__VERSION__|${APP_VERSION}|g" -e "s|__ROOT__|${root}|g" \
            packaging/linux/melotag.spec > dist/rpmbuild/SPECS/melotag.spec
          sed -e 's/^Exec=Melotag/Exec=melotag/' \
              -e 's/^StartupWMClass=Melotag/StartupWMClass=melotag/' \
              packaging/linux/melotag.desktop > dist/melotag-rpm.desktop

          rpmbuild -bb --define "_topdir ${root}/dist/rpmbuild" \
            dist/rpmbuild/SPECS/melotag.spec
          cp dist/rpmbuild/RPMS/x86_64/*.rpm \
            "out/melotag-${APP_VERSION}-1.x86_64.rpm"
          ls -lh out/*.rpm

      - name: Publish self-contained Linux (AppImage/Flatpak)
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Melotag.Desktop \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=false \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:Version="$APP_VERSION" \
            -o dist/linux-x64-selfcontained
          find dist/linux-x64-selfcontained -name '*.pdb' -delete

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools desktop-file-utils libfuse2 \
            || sudo apt-get install -y -qq squashfs-tools desktop-file-utils libfuse2t64

          appdir="dist/Melotag.AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" \
                   "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps" \
                   "$appdir/usr/share/licenses/melotag"
          cp -a dist/linux-x64-selfcontained/. "$appdir/usr/bin/"
          chmod +x "$appdir/usr/bin/Melotag"
          cp docs/branding/melotag-logo.png "$appdir/melotag.png"
          cp docs/branding/melotag-logo.png "$appdir/usr/share/icons/hicolor/512x512/apps/melotag.png"
          cp packaging/linux/melotag.desktop "$appdir/melotag.desktop"
          cp packaging/linux/melotag.desktop "$appdir/usr/share/applications/melotag.desktop"
          cp LICENSE "$appdir/usr/share/licenses/melotag/LICENSE"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Melotag" "$@"
          EOF
          chmod +x "$appdir/AppRun"

          if ! curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"; then
            curl -fsSL -o /tmp/appimagetool \
              "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          fi
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "$appdir" "out/Melotag-${APP_VERSION}-x86_64.AppImage"
          ls -lh out/*.AppImage

      - name: Build Flatpak
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

          flatpak_src="dist/flatpak-src"
          rm -rf "$flatpak_src"
          mkdir -p "$flatpak_src/app"
          cp -a dist/linux-x64-selfcontained/. "$flatpak_src/app/"
          cp packaging/flatpak/io.melotag.app.desktop "$flatpak_src/"
          cp docs/branding/melotag-logo.png "$flatpak_src/io.melotag.app.png"
          cp LICENSE "$flatpak_src/"
          cp packaging/flatpak/io.melotag.app.yml "$flatpak_src/io.melotag.app.yml"
          sed -i 's|path: ../../dist/flatpak-src|path: .|' "$flatpak_src/io.melotag.app.yml"

          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub \
            --repo=dist/flatpak-repo dist/flatpak-build \
            "$flatpak_src/io.melotag.app.yml"
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            dist/flatpak-repo "out/Melotag-${APP_VERSION}.flatpak" io.melotag.app
          ls -lh out/*.flatpak

      - name: Collect Android APKs
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64 x64; do
            dir="artifacts/melotag-android-${abi}-apk"
            apk=$(find "$dir" -name '*-Signed.apk' -print -quit)
            if [ -z "$apk" ]; then
              echo "未找到 ${abi} 的已签名 APK（$dir）" >&2
              exit 1
            fi
            cp "$apk" "out/Melotag-${APP_VERSION}-android-${abi}.apk"
          done
          ls -lh out

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd out
          shopt -s nullglob
          files=(./*.zip ./*.tar.gz ./*.deb ./*.rpm ./*.AppImage ./*.flatpak ./*.exe ./*.msixbundle ./*.apk)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.RELEASE_TAG }}
          path: out/*
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，覆盖上传附件"
            gh release upload "$RELEASE_TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "音签 Melotag ${RELEASE_TAG#v}" \
              --generate-notes
          fi
