app-id: io.melotag.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: Melotag
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
modules:
  - name: melotag
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -a app/. /app/bin/
      - install -Dm644 io.melotag.app.desktop /app/share/applications/io.melotag.app.desktop
      - install -Dm644 io.melotag.app.png /app/share/icons/hicolor/512x512/apps/io.melotag.app.png
      - install -Dm644 LICENSE /app/share/licenses/io.melotag.app/LICENSE
    sources:
      - type: dir
        path: ../../dist/flatpak-src
