<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="音签 Melotag">
  <title>音签 Melotag</title>
  <defs>
    <linearGradient id="tile" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0" stop-color="#6E5BF5" />
      <stop offset="1" stop-color="#18BED6" />
    </linearGradient>
    <!-- 标签孔：像行李牌那样真正打穿底板 -->
    <mask id="punch">
      <rect width="512" height="512" fill="#fff" />
      <circle cx="115.7" cy="118.8" r="29.7" fill="#000" />
    </mask>
  </defs>
  <g mask="url(#punch)">
    <rect x="11.3" y="11.3" width="489.4" height="489.4" rx="110.1" fill="url(#tile)" />
  </g>
  <!-- 音柱：三条等宽圆头竖条 -->
  <rect x="153.6" y="210.0" width="55.3" height="169.0" rx="27.6" fill="#fff" />
  <rect x="240.9" y="153.6" width="55.3" height="281.6" rx="27.6" fill="#fff" />
  <rect x="328.3" y="187.9" width="55.3" height="213.0" rx="27.6" fill="#fff" />
</svg>
